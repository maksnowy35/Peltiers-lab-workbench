[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teglab"
version = "0.3.0"
description = "Thermoelectric (Peltier/TEG) pair analysis: ANSYS import, 1D model calibration, geometry & material optimization, lab planning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maksymilian Kruk" }]
# Ranges that keep the package installable; the exact versions the tests passed with are in
# constraints.txt (pip install -e ".[dev]" -c constraints.txt).
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "numpy>=2.1,<3",
    "pandas>=3.0,<4",
    "scipy>=1.14,<2",
    "pydantic>=2.9,<3",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.18,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.15,<0.16"]

[project.scripts]
teglab = "teglab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teglab = ["data/examples/*", "pipeline/profiles/*.json", "pipeline/examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency / parameter markers are meant to be called in defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body", "fastapi.Form"]
